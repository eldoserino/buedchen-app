server {
    server_name buedchen.slightlymad.de;

    root /var/www/buedchen/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/buedchen/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    location /photos/ {
        alias /var/www/buedchen/frontend/dist/photos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    access_log /var/log/nginx/buedchen.access.log;
    error_log  /var/log/nginx/buedchen.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/buedchen.slightlymad.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/buedchen.slightlymad.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = buedchen.slightlymad.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name buedchen.slightlymad.de;
    return 404; # managed by Certbot
}
