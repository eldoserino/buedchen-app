server {
    listen 80;
    server_name buedchen.slightlymad.de;

    # Frontend (React SPA)
    root /var/www/buedchen/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — PHP-FPM
    location /api/ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/buedchen/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # Fotos (befüllt via Import-Script)
    location /photos/ {
        alias /var/www/buedchen/frontend/dist/photos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # PWA — Service Worker darf nicht gecacht werden
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/buedchen.access.log;
    error_log  /var/log/nginx/buedchen.error.log;
}
